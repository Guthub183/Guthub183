name: Generate Profile Animations

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Generate Snake Animation inside dist/
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 2. Generate 3D Graph (places files in profile-3d-contrib/)
      - name: Generate 3D Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 2.5. Fix directory permissions after actions that may restrict them
      - name: Fix directory permissions
        run: |
          sudo chmod -R 755 dist 2>/dev/null || chmod -R 755 dist 2>/dev/null || true
          sudo chmod -R 755 profile-3d-contrib 2>/dev/null || chmod -R 755 profile-3d-contrib 2>/dev/null || true

      # 3. Move 3D Graph files into dist/profile-3d-contrib/
      - name: Move 3D Graphics to dist
        run: |
          mkdir -p dist/profile-3d-contrib
          cp -r profile-3d-contrib/* dist/profile-3d-contrib/

      # 4. Generate Stats card inside dist/profile-stats/
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&bg_color=0d1117&title_color=A855F7&icon_color=A855F7&text_color=c9d1d9&ring_color=A855F7
          path: dist/profile-stats/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 5. Generate Top Languages card inside dist/profile-stats/
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical&hide_border=true&bg_color=0d1117&title_color=A855F7&langs_count=8
          path: dist/profile-stats/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 6. Deploy the entire dist/ folder to the 'output' branch (which doesn't show green contributions on main)
      - name: Push graphics to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
